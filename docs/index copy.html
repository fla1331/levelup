<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #111B2E;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 30% 40%, rgba(250, 204, 21, 0.12) 0%, transparent 55%),
                radial-gradient(circle at 70% 60%, rgba(17, 27, 46, 0.55) 0%, transparent 55%);
            pointer-events: none;
        }
        .splash {
            text-align: center;
            position: relative;
            z-index: 1;
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .splash__logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 130px;
            height: 130px;
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(250, 204, 21, 0.25);
            border-radius: 28px;
            backdrop-filter: blur(8px);
            animation: float 3s ease-in-out infinite;
        }
        .splash__logo svg { width: 65px; height: 65px; }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-6px); }
        }
        .splash__loader {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            height: 40px;
        }
        .splash__loader span {
            display: block;
            width: 6px;
            height: 24px;
            border-radius: 999px;
            background: #facc15;
            animation: bars 1.2s ease-in-out infinite;
        }
        .splash__loader span:nth-child(1) { animation-delay: 0s;    }
        .splash__loader span:nth-child(2) { animation-delay: 0.15s; }
        .splash__loader span:nth-child(3) { animation-delay: 0.3s;  }
        @keyframes bars {
            0%, 100% { transform: scaleY(0.4); opacity: 0.4; }
            50%      { transform: scaleY(1);   opacity: 1;   }
        }
    </style>
</head>
<body>
    <div class="splash">
        <div class="splash__logo">
            <svg 
  fill="#000000" 
  width="45" 
  height="45" 
  viewBox="0 0 24 24" 
  id="game-console-cable" 
  data-name="Flat Line" 
  xmlns="http://www.w3.org/2000/svg" 
  class="icon flat-line"
>
  <path 
    id="secondary" 
    d="M20.42,10.71a4,4,0,0,0-4-3.71H15l-.5,2h-5L9,7H7.57a4,4,0,0,0-4,3.71l-.57,8A2.12,2.12,0,0,0,5.24,21a2.24,2.24,0,0,0,2-1.82L8,15.79a1,1,0,0,1,1-.79h6.12a1,1,0,0,1,1,.79l.73,3.39a2.24,2.24,0,0,0,2,1.82A2.12,2.12,0,0,0,21,18.72Z" 
    style="fill: rgb(44, 169, 188); stroke-width: 2;"
  ></path>
  <path 
    id="primary" 
    d="M15,7H9l.5,2h5ZM12,3V7m4.43,0a4,4,0,0,1,4,3.72l.57,8A2.12,2.12,0,0,1,18.76,21a2.24,2.24,0,0,1-2-1.82L16,15.79a1,1,0,0,0-1-.79H8.94a1,1,0,0,0-1,.79l-.73,3.39a2.24,2.24,0,0,1-2,1.82A2.12,2.12,0,0,1,3,18.72l.57-8A4,4,0,0,1,7.57,7Z" 
    style="fill: none; stroke: rgb(0, 0, 0); stroke-linecap: round; stroke-linejoin: round; stroke-width: 2;"
  ></path>
</svg>
        </div>
        <div class="splash__loader" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
    <script>
        (function() {
            var idiomas = ['pt', 'en', 'es'];
            var idiomaPadrao = 'pt';
            var lang = (navigator.language || navigator.userLanguage || idiomaPadrao).substring(0, 2).toLowerCase();
            var destino = idiomas.includes(lang) ? lang : idiomaPadrao;
            setTimeout(function() {
                window.location.replace('/' + destino + '/');
            }, 900);
        })();
    </script>
</body>
</html>
