<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Em manutenção — Seu Site</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #333;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }

  .wrap {
    max-width: 420px;
    animation: fadeIn 0.6s ease;
  }

  .leaf {
    width: 96px;
    height: 96px;
    margin: 0 auto 28px;
    display: block;
    color: #4a7c4a;
  }

  h1 {
    font-size: 1.35rem;
    font-weight: 600;
    margin-bottom: 10px;
    letter-spacing: -0.01em;
  }

  p {
    font-size: 0.95rem;
    line-height: 1.5;
    color: #5a6b5a;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-color-scheme: dark) {
    html, body { background: #fff; color: #333; }
    p { color: #8a9a8a; }
    .leaf { color: #7db07d; }
  }
</style>
</head>
<body>

  <main class="wrap">
   <svg 
  fill="#000000" 
  width="45" 
  height="45" 
  viewBox="0 0 24 24" 
  id="game-console-cable" 
  data-name="Flat Line" 
  xmlns="http://www.w3.org/2000/svg" 
  class="icon flat-line"
>
  <path 
    id="secondary" 
    d="M20.42,10.71a4,4,0,0,0-4-3.71H15l-.5,2h-5L9,7H7.57a4,4,0,0,0-4,3.71l-.57,8A2.12,2.12,0,0,0,5.24,21a2.24,2.24,0,0,0,2-1.82L8,15.79a1,1,0,0,1,1-.79h6.12a1,1,0,0,1,1,.79l.73,3.39a2.24,2.24,0,0,0,2,1.82A2.12,2.12,0,0,0,21,18.72Z" 
    style="fill: rgb(44, 169, 188); stroke-width: 2;"
  ></path>
  <path 
    id="primary" 
    d="M15,7H9l.5,2h5ZM12,3V7m4.43,0a4,4,0,0,1,4,3.72l.57,8A2.12,2.12,0,0,1,18.76,21a2.24,2.24,0,0,1-2-1.82L16,15.79a1,1,0,0,0-1-.79H8.94a1,1,0,0,0-1,.79l-.73,3.39a2.24,2.24,0,0,1-2,1.82A2.12,2.12,0,0,1,3,18.72l.57-8A4,4,0,0,1,7.57,7Z" 
    style="fill: none; stroke: rgb(0, 0, 0); stroke-linecap: round; stroke-linejoin: round; stroke-width: 2;"
  ></path>
</svg>


    <h1 id="title">Voltamos em breve</h1>
    <p id="sub">Estamos fazendo uma manutenção rápida. Obrigado pela paciência!</p>
  </main>

<script>
  // Detecta idioma do navegador e traduz automaticamente
  const i18n = {
    pt: {
      title: "Voltamos em breve",
      sub:   "Estamos fazendo uma manutenção rápida. Obrigado pela paciência!"
    },
    en: {
      title: "Back soon",
      sub:   "We're doing a quick maintenance. Thanks for your patience!"
    },
    es: {
      title: "Volvemos pronto",
      sub:   "Estamos haciendo un mantenimiento rápido. ¡Gracias por tu paciencia!"
    }
  };

  const lang = (navigator.language || "pt").slice(0, 2).toLowerCase();
  const t = i18n[lang] || i18n.pt;

  document.documentElement.lang = i18n[lang] ? lang : "pt";
  document.getElementById("title").textContent = t.title;
  document.getElementById("sub").textContent   = t.sub;
</script>

</body>
</html>
